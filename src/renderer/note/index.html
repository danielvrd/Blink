<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blink-anexo:; frame-src 'self';">
  <title>Fast Note</title>

  <link rel="stylesheet" href="../comum/tokens.css">
  <link rel="stylesheet" href="../comum/base.css">
  <!-- O editor da folha livre (Quill): so o essencial; o visual e do note.css -->
  <link rel="stylesheet" href="../../../node_modules/quill/dist/quill.core.css">
  <link rel="stylesheet" href="note.css">
</head>
<body>

  <div class="modal">

    <header class="cabecalho">
      <div class="titulo">
        <!-- O olho abre as configuracoes do Blink, na aba do Fast Note -->
        <button class="botao-olho" id="btn-olho" title="Abrir as configurações do Blink" aria-label="Abrir as configurações do Blink">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="1" y="1" width="22" height="22" rx="6.5" fill="#1b1c23" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.8"></rect>
            <path d="M5 11 Q12 17.4 19 11" fill="none" stroke="#e6e8ee" stroke-width="1.9" stroke-linecap="round"></path>
            <path d="M8.2 14.4 L7 16.9 M12 15.8 V18.6 M15.8 14.4 L17 16.9" fill="none" stroke="#e6e8ee" stroke-width="1.5" stroke-linecap="round"></path>
            <path d="M18.4 3.6 C18.6 5.2 19.4 6 21 6.2 C19.4 6.4 18.6 7.2 18.4 8.8 C18.2 7.2 17.4 6.4 15.8 6.2 C17.4 6 18.2 5.2 18.4 3.6 Z" fill="#ff5a6b"></path>
          </svg>
        </button>
        <span class="nome-janela">Fast Note</span>
        <!-- O seletor de arquivos (com todas as marcas: estrela, relogio, cadeado, folha, quadro, texto) fica no
             cabecalho; abrir um arquivo por ele (ou por "/nome") abre ou ativa a aba dele (seletor.js, abas.js) -->
        <div class="seletor" id="seletor-arquivo"></div>
      </div>
      <!-- Salvar (aba rapida), imagem (folha e quadro), copiar, limpar e excluir: os botoes do arquivo aberto -->
      <div class="acoes-arquivo">
        <!-- So na aba rapida: salva o texto como um arquivo (pede o nome) -->
        <button class="botao-acao" id="btn-salvar-aba" title="Salvar como arquivo (Ctrl+S)" aria-label="Salvar a aba como arquivo" hidden>
          <!-- disquete -->
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 4.5h12l3 3v12h-15z" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round"></path>
            <path d="M8 4.5v5h7v-5M8 19.5v-6h8v6" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path>
          </svg>
        </button>

        <!-- So em folha livre: copia o print da folha inteira -->
        <button class="botao-acao" id="btn-imagem" title="Copiar a folha como imagem" aria-label="Copiar a folha como imagem" hidden>
          <!-- moldura com montanha e sol -->
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="14" rx="2.2" fill="none" stroke="#ffffff" stroke-width="1.8"></rect>
            <circle cx="9" cy="10" r="1.6" fill="#ffffff"></circle>
            <path d="M4.5 17.5 L10 13 L13.5 16 L16 14 L19.5 17.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>
          </svg>
        </button>

        <button class="botao-acao" id="btn-copiar" title="Copiar todas as anotações" aria-label="Copiar as anotações">
          <!-- letra C, desenhada por traço para não depender de fonte -->
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.75 8 A6.2 6.2 0 1 0 16.75 16" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"></path>
          </svg>
        </button>

        <button class="botao-acao" id="btn-limpar" title="Limpar tudo" aria-label="Limpar todas as notas">
          <!-- vassoura -->
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="2" x2="12.2" y2="12" stroke="#f5eceb" stroke-width="2" stroke-linecap="round"></line>
            <path d="M9 11 L15.5 11 L18.5 21 L5.5 21 Z" fill="#f5eceb"></path>
            <rect x="9" y="10.2" width="6.5" height="2" rx="0.6" fill="#5a1a1b"></rect>
            <line x1="9.7" y1="13.2" x2="8" y2="21" stroke="#a8393a" stroke-width="1"></line>
            <line x1="12.3" y1="13.2" x2="12" y2="21" stroke="#a8393a" stroke-width="1"></line>
            <line x1="14.9" y1="13.2" x2="16.3" y2="21" stroke="#a8393a" stroke-width="1"></line>
          </svg>
        </button>

        <button class="botao-acao" id="btn-excluir" title="Excluir arquivo" aria-label="Excluir este arquivo">
          <!-- lixeira -->
          <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6.5 H20" stroke="#f5eceb" stroke-width="2.2" stroke-linecap="round"></path>
            <path d="M9.5 6 V4.2 Q9.5 3 10.7 3 H13.3 Q14.5 3 14.5 4.2 V6" stroke="#f5eceb" stroke-width="2" fill="none"></path>
            <path d="M6 8.5 L7.2 20 Q7.4 21.5 9 21.5 H15 Q16.6 21.5 16.8 20 L18 8.5 Z" fill="#f5eceb"></path>
            <line x1="10" y1="11.5" x2="10.4" y2="18.5" stroke="#a8393a" stroke-width="1.3"></line>
            <line x1="14" y1="11.5" x2="13.6" y2="18.5" stroke="#a8393a" stroke-width="1.3"></line>
          </svg>
        </button>

        <!-- Confirmacao do limpar tudo, ancorada ao botao -->
        <div class="popover" id="popover-limpar" hidden>
          <div class="pergunta" id="pergunta-limpar">Limpar todas as notas deste arquivo?</div>
          <div class="botoes">
            <button class="botao-primario" id="btn-limpar-sim">Limpar</button>
            <button class="botao-fantasma" id="btn-limpar-nao">Não</button>
          </div>
        </div>

        <!-- Confirmacao de excluir o arquivo, no mesmo formato -->
        <div class="popover" id="popover-excluir" hidden>
          <div class="pergunta" id="pergunta-excluir">Excluir este arquivo?</div>
          <div class="botoes">
            <button class="botao-primario" id="btn-excluir-sim">Excluir</button>
            <button class="botao-fantasma" id="btn-excluir-nao">Não</button>
          </div>
        </div>

        <!-- Desmarcar uma tarefa cujo topico na daily tem anotacoes (tarefas.md -> daily) -->
        <div class="popover" id="popover-daily" hidden>
          <div class="pergunta" id="pergunta-daily">O tópico na daily tem anotações. Remover mesmo assim?</div>
          <div class="botoes">
            <button class="botao-primario" id="btn-daily-sim">Remover</button>
            <button class="botao-fantasma" id="btn-daily-nao">Cancelar</button>
          </div>
        </div>
      </div>
      <div class="botoes-janela">
        <button class="botao-x" id="btn-minimizar" title="Minimizar" aria-label="Minimizar">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line>
          </svg>
        </button>
        <button class="botao-x" id="btn-fechar" title="Fechar" aria-label="Fechar">×</button>
      </div>
    </header>

    <div class="corpo">

      <!-- So as abas abertas e o botao de nova aba (+); os botoes do arquivo ficam no cabecalho -->
      <div class="linha-arquivo">
        <div class="barra-abas" id="barra-abas"></div>
        <button class="botao-aba-nova" id="btn-nova-aba" title="Nova aba rápida: só texto, para colar algo (Ctrl+T)" aria-label="Nova aba rápida">
          <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>

      <!-- So aparece com o relogio ligado no arquivo aberto (calendario.js) -->
      <div class="calendario" id="calendario-historico" hidden></div>

      <!-- Só aparece quando "+ Criar nova nota" está escolhido: o nome (Enter cria a nota na hora) e, à direita, os mesmos
           ícones do seletor para escolher o tipo (montados pelo note.js) -->
      <div class="linha-nome" id="linha-nome" hidden>
        <input class="campo-nome" id="campo-nome" placeholder="nome-da-nota.md" aria-label="Nome da nota nova" autocomplete="off" spellcheck="false">
        <div class="tipos-nota" id="tipos-nota" role="group" aria-label="Tipo da nota nova"></div>
      </div>

      <div class="lista" id="lista"></div>

      <!-- Uma aba rapida (so texto) ou um arquivo em modo texto: o texto inteiro num editor simples -->
      <textarea class="texto-livre" id="texto-livre" placeholder="Cole ou escreva aqui…" spellcheck="false" hidden></textarea>

      <!-- Arquivo em folha livre: o editor de pagina (folha.js) no lugar da lista e do rascunho -->
      <div class="folha-livre" id="folha-livre" hidden></div>

      <!-- Arquivo em quadro branco: o Excalidraw num iframe (quadro.js; a pagina e renderer/quadro) -->
      <div class="quadro-livre" id="quadro-livre" hidden></div>

      <!-- Arquivo com cadeado, ainda fechado: a senha no lugar da lista (notas-privadas.js guarda a chave so
           enquanto o arquivo esta aberto) -->
      <div class="tela-senha" id="tela-senha" hidden>
        <svg class="cadeado-grande" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <circle cx="12" cy="15.4" r="1.3" fill="currentColor"></circle>
        </svg>
        <div class="nome-privado" id="nome-privado"></div>
        <div class="dica-privado">Arquivo privado. Digite a senha para abrir.</div>
        <input class="campo-privado" id="senha-abrir" type="password" placeholder="Senha" aria-label="Senha do arquivo" autocomplete="off" spellcheck="false">
        <div class="erro-privado" id="erro-abrir" hidden></div>
        <button class="botao-primario botao-abrir-privado" id="btn-abrir-privado">Abrir</button>
      </div>

      <!-- Com o arquivo privado aberto: o aviso e o botao de nova credencial -->
      <div class="barra-privado" id="barra-privado" hidden>
        <span class="barra-privado-texto">Arquivo privado e criptografado</span>
        <button class="botao-fantasma botao-credencial" id="btn-credencial" title="Adicionar uma credencial (título, login e senha)">+ credencial</button>
      </div>

      <!-- O rascunho e, logo acima dele, a lista do autocomplete de "/" (escondido na folha livre) -->
      <div class="area-rascunho" id="area-rascunho">
        <div class="popup-notas" id="popup-notas" role="listbox" hidden></div>
        <textarea class="rascunho" id="rascunho" placeholder="Escreva e pressione Enter…" spellcheck="false"></textarea>
      </div>

      <div class="dica" id="dica"></div>

    </div>

    <!-- Pergunta de senha (pôr e tirar o cadeado, ver uma credencial) e formulário de credencial nova. Os campos
         são montados por note.js e apagados ao fechar. -->
    <div class="modal-privado" id="modal-privado" hidden>
      <div class="caixa-privado" role="dialog" aria-modal="true" aria-labelledby="titulo-privado">
        <div class="titulo-privado" id="titulo-privado"></div>
        <div class="texto-privado" id="texto-privado"></div>
        <div class="campos-privado" id="campos-privado"></div>
        <div class="erro-privado" id="erro-privado" hidden></div>
        <div class="botoes-privado">
          <button class="botao-primario" id="btn-privado-ok">OK</button>
          <button class="botao-fantasma" id="btn-privado-nao" hidden>Não salvar</button>
          <button class="botao-fantasma" id="btn-privado-cancelar">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../comum/ui.js"></script>
  <script src="../comum/links.js"></script>
  <script src="../comum/atualizacao.js"></script>
  <script src="../comum/aparencia.js"></script>
  <script src="../../../node_modules/quill/dist/quill.js"></script>
  <script src="tinta.js"></script>
  <script src="folha.js"></script>
  <script src="quadro.js"></script>
  <script src="seletor.js"></script>
  <script src="abas.js"></script>
  <script src="calendario.js"></script>
  <script src="autocompletar.js"></script>
  <script src="note.js"></script>
</body>
</html>
