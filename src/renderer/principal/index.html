<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy: a tela so pode carregar o que vem do proprio
    projeto. Sem script de fora, sem conexao para fora. O app e local.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;">
  <title>Blink</title>

  <link rel="stylesheet" href="../comum/tokens.css">
  <link rel="stylesheet" href="../comum/base.css">
  <link rel="stylesheet" href="principal.css">
</head>
<body>

  <!--
    A janela do Electron e transparente e sem moldura. Esta div e a janela
    que o usuario ve: fundo, borda e o canto arredondado de 16px.
  -->
  <div class="janela">

    <!-- Barra de titulo, no estilo do Windows. Arrastar aqui move a janela. -->
    <header class="barra-titulo">
      <div class="titulo">
        <!-- O olho do Blink: a caixa do icone com o anel, a iris e a pupila (o mesmo do olho-simples.svg;
             o filete claro na caixa a separa do fundo escuro do cabecalho) -->
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="6.5" fill="#1b1c23" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.8"></rect>
          <circle cx="12" cy="12" r="6" fill="none" stroke="#d6d9e0" stroke-width="1.7"></circle>
          <circle cx="12" cy="12" r="3.5" fill="#cb3e3e"></circle>
          <circle cx="12" cy="12" r="1.8" fill="#14050a"></circle>
          <circle cx="13.2" cy="10.8" r="0.9" fill="#ffffff" opacity="0.92"></circle>
        </svg>
        <span>Blink</span>
      </div>

      <div class="botoes-janela">
        <button class="botao-janela" id="btn-minimizar" title="Minimizar" aria-label="Minimizar">
          <span class="icone-minimizar"></span>
        </button>
        <button class="botao-janela" id="btn-maximizar" title="Maximizar" aria-label="Maximizar">
          <span class="icone-maximizar"></span>
        </button>
        <button class="botao-janela fechar" id="btn-fechar" title="Esconder na bandeja" aria-label="Esconder na bandeja">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"></line>
            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- As tres abas. O conteudo de cada uma e montado pelo JavaScript. -->
    <nav class="barra-abas" id="barra-abas"></nav>
    <main class="conteudo" id="conteudo"></main>

  </div>

  <!--
    Scripts comuns, na ordem: cada arquivo pendura o que expoe no objeto
    global `Blink`, e o principal.js, que vem por ultimo, usa todos eles.

    Sao <script> comuns de proposito, sem type="module": as telas carregam
    pelo protocolo file:, e o navegador recusa modulos por esse protocolo.
  -->
  <script src="../comum/ui.js"></script>
  <script src="../comum/atualizacao.js"></script>
  <script src="../comum/aparencia.js"></script>
  <script src="pecas.js"></script>
  <script src="campo-bind.js"></script>
  <script src="aba-diff.js"></script>
  <script src="aba-note.js"></script>
  <script src="aba-sql.js"></script>
  <script src="aba-i18n.js"></script>
  <script src="principal.js"></script>
</body>
</html>
