<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;">
  <title>Comparação de texto</title>

  <link rel="stylesheet" href="../comum/tokens.css">
  <link rel="stylesheet" href="../comum/base.css">
  <link rel="stylesheet" href="diff.css">
</head>
<body>

  <!--
    A janela do Electron e transparente e sem moldura; esta div e a
    comparacao que o usuario ve, com o canto arredondado e a borda vermelha
    do design.
  -->
  <div class="modal">

    <header class="cabecalho">
      <div class="titulo">
        <!-- O olho abre as configuracoes do Blink, na aba do Diff Checker -->
        <button class="botao-olho" id="btn-olho" title="Abrir as configurações do Blink" aria-label="Abrir as configurações do Blink">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="1" y="1" width="22" height="22" rx="6.5" fill="#810c3d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.8"></rect>
            <circle cx="12" cy="12" r="6.7" fill="none" stroke="#d6d9e0" stroke-width="1.7"></circle>
            <circle cx="12" cy="12" r="4" fill="#a56464"></circle>
            <circle cx="12" cy="12" r="1.8" fill="#14050a"></circle>
            <circle cx="13.2" cy="10.8" r="0.9" fill="#ffffff" opacity="0.92"></circle>
          </svg>
        </button>
        <span>Comparação de texto</span>
      </div>
      <div class="acoes">
        <button class="botao-contorno" id="btn-copiar-esquerda" title="Copiar o texto do lado esquerdo">Copiar esquerda</button>
        <button class="botao-contorno" id="btn-copiar-direita" title="Copiar o texto do lado direito">Copiar direita</button>
        <div class="botoes-janela">
          <button class="botao-x" id="btn-minimizar" title="Minimizar" aria-label="Minimizar">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line>
            </svg>
          </button>
          <button class="botao-x" id="btn-fechar" title="Fechar" aria-label="Fechar">×</button>
        </div>
      </div>
    </header>

    <!--
      Uma grade de tres colunas: texto da esquerda, calha dos botoes, texto
      da direita. Cada linha do texto ocupa uma linha da grade, entao os dois
      lados ficam sempre na mesma altura, como um livro aberto.

      A regua fica por cima da barra de rolagem e marca onde estao as
      diferencas no texto inteiro - clicar numa marca leva ate ela.
    -->
    <div class="area-corpo">
      <div class="corpo" id="corpo">
        <div class="grade" id="grade"></div>
      </div>
      <div class="regua" id="regua" hidden></div>
    </div>

    <footer class="rodape">
      <span class="legenda"><span class="marca pendente"></span>Diferença</span>
      <span class="legenda"><span class="marca aplicada"></span>Aplicado</span>
      <!-- So na demonstracao: troca o exemplo (diff.js) -->
      <span class="exemplos" id="exemplos" hidden></span>
      <span class="dica">Esc minimiza</span>
    </footer>

  </div>

  <script src="../comum/ui.js"></script>
  <script src="../comum/atualizacao.js"></script>
  <script src="../comum/aparencia.js"></script>
  <script src="diff.js"></script>
</body>
</html>
