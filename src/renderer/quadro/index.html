<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- A pagina do quadro branco: o Excalidraw (React) dentro de um iframe do Fast Note (renderer/note/quadro.js).
       A unica pagina do Blink com style-src 'unsafe-inline': o Excalidraw injeta <style>. Mesmo assim: sem
       unsafe-eval, sem rede (connect-src 'self'), fontes e idiomas do disco. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:;">
  <title>Quadro</title>
  <style>
    html, body, #raiz { margin: 0; height: 100%; background: #161616; overflow: hidden; }
  </style>
</head>
<body>
  <div id="raiz"></div>

  <!-- Onde ficam os chunks, as fontes e os idiomas do Excalidraw (a pasta dist do pacote) -->
  <script src="assets.js"></script>
  <script src="../../../node_modules/react/umd/react.production.min.js"></script>
  <script src="../../../node_modules/react-dom/umd/react-dom.production.min.js"></script>
  <script src="../../../node_modules/@excalidraw/excalidraw/dist/excalidraw.production.min.js"></script>
  <script src="quadro.js"></script>
</body>
</html>
