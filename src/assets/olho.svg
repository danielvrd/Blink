<?xml version="1.0" encoding="UTF-8"?>
<!--
  Olho do Blink - versao para os tamanhos grandes do .ico (48 e 256 px),
  usados pela barra de tarefas, pela janela do app e pelo instalador.

  Tem a MESMA geometria do olho-simples.svg: a caixa, o anel, a iris, a pupila
  e o brilho no mesmo lugar. A unica diferenca e o acabamento - degrade na
  caixa, na iris e na pupila, e um filete claro por dentro da caixa, que so
  fazem sentido onde ha pixels suficientes para aparecer.

  Manter a geometria igual nao e capricho: a bandeja pega os tamanhos
  pequenos do .ico e a barra de tarefas pega os grandes. Se os dois
  desenhos divergissem, o mesmo app apareceria com dois icones diferentes
  na mesma tela.

  O width/height de 256 existe so para o sharp rasterizar em alta resolucao
  antes de reduzir. O desenho em si vive no viewBox de 24x24.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262731"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e46a6a"/>
      <stop offset="45%" stop-color="#cb3e3e"/>
      <stop offset="100%" stop-color="#6b1717"/>
    </radialGradient>
    <radialGradient id="pupila" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a1218"/>
      <stop offset="70%" stop-color="#120406"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- a caixa, com um filete claro por dentro -->
  <rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#fundo)"/>
  <rect x="1.4" y="1.4" width="21.2" height="21.2" rx="6.1" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.6"/>

  <!-- anel claro do olho: identico ao do olho-simples.svg -->
  <circle cx="12" cy="12" r="6" fill="none" stroke="#d6d9e0" stroke-width="1.7"/>

  <!-- iris -->
  <circle cx="12" cy="12" r="3.5" fill="url(#iris)"/>
  <circle cx="12" cy="12" r="3.5" fill="none" stroke="#3a0810" stroke-width="0.4"/>

  <!-- pupila -->
  <circle cx="12" cy="12" r="1.8" fill="url(#pupila)"/>

  <!-- brilho -->
  <circle cx="13.2" cy="10.8" r="0.9" fill="#ffffff" opacity="0.92"/>
</svg>
