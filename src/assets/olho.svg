<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blink - versao para os tamanhos grandes do .ico (48 e 256 px), usados pela barra de tarefas, pela janela do app e
  pelo instalador.

  Tem a MESMA geometria do olho-simples.svg: a caixa, a palpebra, os cilios e a faisca no mesmo lugar. A unica
  diferenca e o acabamento - degrade na caixa e na faisca, e um filete claro por dentro da caixa, que so fazem sentido
  onde ha pixels suficientes para aparecer.

  Manter a geometria igual nao e capricho: a bandeja pega os tamanhos pequenos do .ico e a barra de tarefas pega os
  grandes. Se os dois desenhos divergissem, o mesmo app apareceria com dois icones diferentes na mesma tela.

  O width/height de 256 existe so para o sharp rasterizar em alta resolucao antes de reduzir. O desenho em si vive no
  viewBox de 24x24.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262731"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="faisca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a88"/>
      <stop offset="100%" stop-color="#ee4256"/>
    </linearGradient>
  </defs>

  <!-- a caixa, com um filete claro por dentro -->
  <rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#fundo)"/>
  <rect x="1.4" y="1.4" width="21.2" height="21.2" rx="6.1" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.6"/>

  <!-- a palpebra fechada: identica a do olho-simples.svg -->
  <path d="M5 11 Q12 17.4 19 11" fill="none" stroke="#e6e8ee" stroke-width="1.9" stroke-linecap="round"/>

  <!-- os cilios -->
  <path d="M8.2 14.4 L7 16.9 M12 15.8 V18.6 M15.8 14.4 L17 16.9" fill="none" stroke="#e6e8ee" stroke-width="1.5" stroke-linecap="round"/>

  <!-- a faisca -->
  <path d="M18.4 3.6 C18.6 5.2 19.4 6 21 6.2 C19.4 6.4 18.6 7.2 18.4 8.8 C18.2 7.2 17.4 6.4 15.8 6.2 C17.4 6 18.2 5.2 18.4 3.6 Z" fill="url(#faisca)"/>
</svg>
