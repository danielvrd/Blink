<?xml version="1.0" encoding="UTF-8"?>
<!--
  Olho Escarlate - versao simplificada, para os tamanhos pequenos do .ico
  (16, 20 e 24 px). Em 16px um traco de 0.5 no viewBox de 24 daria menos de
  um terco de pixel e viraria borrao cinza, entao aqui:

  - o contorno e mais grosso (1.8 em vez de 1.3);
  - a iris e uma cor chapada, sem gradiente;
  - os quatro tracos da iris e o brilho secundario sairam;
  - o olho e mais alto que o do design.

  A altura e o ponto critico. O amendoa original tem cerca de 8 unidades de
  altura interna no viewBox de 24, o que da menos de 6 pixels em 16px: a iris
  encosta na palpebra e o icone vira um borrao vermelho. Aqui o olho vai de
  3.5 a 20.5 e sobra espaco para contorno, iris, pupila e brilho se separarem.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24">
  <!-- contorno do olho, mais alto e mais grosso que o do design -->
  <path d="M1.5 12 C5.5 3.5 18.5 3.5 22.5 12 C18.5 20.5 5.5 20.5 1.5 12 Z" stroke="#d6d9e0" stroke-width="1.8" fill="none" stroke-linejoin="round"/>

  <!-- iris chapada -->
  <circle cx="12" cy="12" r="4.4" fill="#e0263b"/>

  <!-- pupila -->
  <circle cx="12" cy="12" r="2" fill="#14050a"/>

  <!-- brilho -->
  <circle cx="13.2" cy="10.7" r="1.05" fill="#ffffff" opacity="0.92"/>
</svg>
